services:
  - type: web
    name: portfolio-cms-api
    runtime: node
    plan: free
    region: singapore
    # --include=dev: Render sets NODE_ENV=production, which makes plain `npm ci`
    # skip devDependencies — but @nestjs/cli (nest build) and sequelize-cli
    # (migrations, run from startCommand) are both devDependencies.
    buildCommand: npm ci --include=dev && npm run build
    # No migrations here: the deployed app connects as the scoped cms_app role
    # (SELECT/INSERT/UPDATE/DELETE on its 4 tables only, no CREATE), and the
    # superuser creds sequelize-cli would need are deliberately kept out of every
    # deployed environment — see backend/.env. Run `npm run db:migrate` locally
    # with DB_SUPERUSER_* set instead, before deploying a change that adds one.
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: 'true'
      - key: JWT_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN_DAYS
        value: 30
      - key: FRONTEND_ORIGIN
        sync: false
