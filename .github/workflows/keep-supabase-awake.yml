name: Keep Supabase project awake

# Supabase's free tier auto-pauses a project after ~7 days with no API
# activity. This pings the REST API every 3 days (comfortable margin) so a
# personal-portfolio demo that isn't visited daily never sits idle long
# enough to pause.
#
# Uses only the "publishable" (anon) key -- safe to commit, it's meant to be
# public. Row Level Security is enabled with no policies on every table
# (see migrations/20260101000009-enable-rls.js), so this always gets an
# empty [] back rather than real data -- a 200 response is all that's
# needed to count as activity.

on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://dargpbknmjfhhfdyoajj.supabase.co/rest/v1/articles?select=id&limit=1" \
            -H "apikey: sb_publishable__dV-Sah_f3EIZs8leFPVqg_-GaiwBDo")
          echo "Response: $status"
          if [ "$status" != "200" ]; then
            echo "::warning::Unexpected status $status from Supabase ping"
          fi
